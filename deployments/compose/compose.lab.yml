# compose.lab.yml — acceptance-test fixture (Compose Specification).
# See: https://github.com/compose-spec/compose-spec/blob/main/spec.md
#
# Four services, and the count is deliberate (ADR 0005):
#
#   auth-pg    Authoritative on PostgreSQL — the common deployment
#   auth-lmdb  Authoritative on LMDB       — the only backend implementing
#                                            views and networks
#   recursor   Recursor with api_dir set   — without it every write is 422
#   postgres   backend for auth-pg
#
# A single-backend fixture cannot test this provider: on gpgsql a view write
# returns 422 while a view read returns 200 with an empty list, so the failure
# is invisible to a read-only check.
#
# Run with: podman-compose -f deployments/compose/compose.lab.yml up -d
# Or:       task lab:up

name: terraform-provider-powerdns-lab

services:
  postgres:
    container_name: pdns-lab-pg
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: pdns
      POSTGRES_DB: pdns
    ports:
      - "15432:5432"
    volumes:
      # Short form, not long: the Compose Specification long syntax has no way
      # to request SELinux relabelling, and without :z the container cannot
      # read the file at all on an SELinux host.
      - ../../test/lab/schema.pgsql.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdns -d pdns"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-pg:
    container_name: pdns-lab-auth-pg
    image: docker.io/powerdns/pdns-auth-51:5.1.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../test/lab/pdns-gpgsql.conf:/etc/powerdns/pdns.conf:ro,z
    ports:
      - "15300:5300/udp"
      - "15300:5300/tcp"
      - "18081:8081/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-API-Key: labapikey' http://127.0.0.1:8081/api/v1/servers"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-lmdb:
    container_name: pdns-lab-auth-lmdb
    image: docker.io/powerdns/pdns-auth-51:5.1.3
    # Runs as root because it writes the LMDB file into a named volume.
    user: root
    volumes:
      - ../../test/lab/pdns-lmdb.conf:/etc/powerdns/pdns.conf:ro,z
      - lmdb-data:/data
    ports:
      - "18091:8081/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-API-Key: labapikey' http://127.0.0.1:8081/api/v1/servers"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  recursor:
    container_name: pdns-lab-recursor
    image: docker.io/powerdns/pdns-recursor-54:5.4.4
    # Runs as root because the API writes zones and ACLs into api_dir.
    user: root
    volumes:
      - ../../test/lab/recursor.yml:/etc/powerdns/recursor.yml:ro,z
      - recursor-api:/var/lib/powerdns-api
    ports:
      - "15301:5301/udp"
      - "15301:5301/tcp"
      - "18082:8082/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-API-Key: labapikey' http://127.0.0.1:8082/api/v1/servers"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  lmdb-data:
  recursor-api:
