version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      go-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/hashicorp/terraform-plugin-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /deployments/containers
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
